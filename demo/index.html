<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit Graph demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { position: absolute; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  canvas.is-hovering { cursor: pointer; }
  canvas.is-dragging { cursor: grabbing; }
  #hover { position: absolute; left: 12px; bottom: 10px; color: #9fb4ff; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hover"></div>
<script src="dist/demo.js"></script>
</body>
</html>
